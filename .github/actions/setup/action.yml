name: setup

description: setup

runs:
  using: composite
  steps:
    - name: Setup foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly
    - name: Setup node
      uses: actions/setup-node@v5
      with:
        node-version: "22.10.x"
        cache: npm
    - name: Install packages
      run: make install
      shell: bash
